[server]
host = "0.0.0.0"
port = 8080
# timezone: IANA name deciding what "today" means on the dashboard.
# Records are TIMESTAMPTZ, so a day needs a zone. Defaults to Local.
timezone = "Local"
# secure_cookies: marks session and CSRF cookies Secure. Keep true in
# production; set false only for plain-HTTP local development.
secure_cookies = true

[database]
host = "localhost"
port = 5455
name = "trackkr"
user = "trackkr"
# password from env var TRACKKR_DB_PASSWORD
sslmode = "disable"

[auth]
# session_secret from env var TRACKKR_SESSION_SECRET
# allow_registration: set to true to enable web-based user signup
allow_registration = false
