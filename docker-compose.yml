services:
  db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: trackkr
      POSTGRES_USER: trackkr
      POSTGRES_PASSWORD: trackkr
    ports:
      - "5455:5432"
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory and
      # refuses to start when the mount is at .../data instead.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
