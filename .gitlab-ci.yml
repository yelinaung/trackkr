stages:
- security
- validate
- test
- deploy
- observability

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # Test fixtures exercise filesystem and database APIs deliberately; they
  # are covered by Go tests and should not be treated as production sinks.
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, **/*_test.go"
  ALPINE_JQ_IMAGE: apteno/alpine-jq:latest@sha256:2618c251ddb92dd09e9bee03769792df70a31083a8d4105472ef5c823b2fb8e3
  # renovate: datasource=github-releases depName=equinix-labs/otel-cli
  OTEL_CLI_VERSION: 0.4.5

include:
- template: Security/Secret-Detection.gitlab-ci.yml
- template: Security/SAST.gitlab-ci.yml

secret_detection:
  stage: security
  tags:
  - playground-bravo

check_secrets:
  stage: validate
  image: $ALPINE_JQ_IMAGE
  tags:
  - playground-bravo
  needs:
  - job: secret_detection
    artifacts: true
  script:
  - |
    if [ ! -f "gl-secret-detection-report.json" ]; then
      echo "Secret detection report not found!"
      exit 1
    fi

    if [ "$(jq '.vulnerabilities | length' gl-secret-detection-report.json)" -gt 0 ]; then
      echo "Secrets detected in the codebase!"
      jq -r '.vulnerabilities[] | "- \(.message) in \(.location.file):\(.location.start_line)"' \
        gl-secret-detection-report.json
      exit 1
    else
      echo "No secrets detected"
    fi

lint:
  stage: validate
  image: golangci/golangci-lint:v2.12-alpine@sha256:91b27804074a0bacea298707f016911e60cf0cdbc6c7bf5ccacb5f0606d18d60
  tags:
  - playground-bravo
  cache:
    key: go-lint-cache
    paths:
    - .cache/golangci-lint
  script:
  - golangci-lint run --timeout=5m ./...


.go-test:
  image: golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651
  tags:
  - playground-bravo
  services:
  - name: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    alias: postgres
  variables:
    POSTGRES_DB: trackkr
    POSTGRES_USER: trackkr
    POSTGRES_PASSWORD: trackkr
    # No TRACKKR_TEST_DSN: the database tests assemble one from the variables
    # above. Spelling the DSN out here duplicated the credentials and left a
    # connection string carrying a password in the tree, which secret
    # scanning reports on every pipeline.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  cache:
    key: go-mod-cache
    paths:
    - .cache/go-build
    - .cache/go-mod
  before_script:
  - export GOCACHE="$(pwd)/.cache/go-build"
  - export GOMODCACHE="$(pwd)/.cache/go-mod"
  - |
    for attempt in $(seq 1 30); do
      if bash -c 'echo > /dev/tcp/postgres/5432' 2>/dev/null; then
        break
      fi
      if [ "$attempt" -eq 30 ]; then
        echo "PostgreSQL did not become reachable" >&2
        exit 1
      fi
      sleep 1
    done

test:
  extends: .go-test
  stage: test
  needs:
  - job: check_secrets
  - job: lint
  script:
  - go test -v -coverprofile=coverage.out -covermode=atomic ./...
  - |
    coverage=$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%$/, "", $3); print $3 }')
    threshold=70
    echo "Coverage: ${coverage}% (threshold: ${threshold}%)"
    if [ "$(awk "BEGIN {print (${coverage} < ${threshold})}")" = "1" ]; then
      echo "Coverage ${coverage}% is below threshold ${threshold}%!" >&2
      exit 1
    fi
  artifacts:
    when: always
    paths:
    - coverage.out

test-race:
  extends: .go-test
  stage: test
  needs:
  - job: check_secrets
  - job: lint
  script:
  - go test -v -race ./...

container-smoke:
  stage: test
  image:
    name: docker:29.6.2-cli@sha256:be132a9f282288de4afaf63379dff75711fda0147c6b72a9df44e51841402144
    entrypoint: [""]
  tags:
  - playground-bravo
  services:
  - name: docker:29.6.2-dind@sha256:bfec1f5159c63a81ca6fdedbd81404d2c0e16378ed0feec3bb3fbf3998847659
    alias: docker
    command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs:
  - job: lint
  before_script:
  - apk add --no-cache bash openssl
  - |
    docker_host=""
    for attempt in $(seq 1 30); do
      for candidate in tcp://docker:2375 tcp://localhost:2375 unix:///var/run/docker.sock; do
        if DOCKER_HOST="${candidate}" docker info >/dev/null 2>&1; then
          docker_host="${candidate}"
          break 2
        fi
      done
      sleep 1
    done
    if [ -z "${docker_host}" ]; then
      echo "Docker daemon unavailable. Configure the runner with privileged Docker-in-Docker or mount /var/run/docker.sock." >&2
      exit 1
    fi
    export DOCKER_HOST="${docker_host}"
    echo "Using Docker endpoint: ${DOCKER_HOST}"
    docker info
  script:
  - bash ./scripts/container-smoke-test.sh

extension:
  stage: test
  image: node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
  tags:
  - playground-bravo
  needs:
  - job: lint
  before_script:
  - apt-get update && apt-get install --yes --no-install-recommends zip unzip
  - npm install --global web-ext@10.5.0
  script:
  - web-ext lint --source-dir extension --warnings-as-errors --ignore-files 'tests/**' 'manifest.chrome.json' 'background-cr.js'
  - node --test 'extension/tests/*.test.js'
  - ./scripts/build-chrome.sh
  - ./scripts/validate-chrome-package.sh

portability:
  stage: test
  image: golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651
  tags:
  - playground-bravo
  needs:
  - job: lint
  cache:
    key: go-mod-cache
    paths:
    - .cache/go-build
    - .cache/go-mod
  before_script:
  - export GOCACHE="$(pwd)/.cache/go-build"
  - export GOMODCACHE="$(pwd)/.cache/go-mod"
  script:
  - bash ./scripts/bundle-macos_test.sh
  - CGO_ENABLED=0 GOOS=darwin go build ./...
  - CGO_ENABLED=0 GOOS=windows go build ./...

semgrep-sast:
  stage: security
  tags:
  - playground-bravo

check_sast:
  stage: validate
  image: $ALPINE_JQ_IMAGE
  tags:
  - playground-bravo
  needs:
  - job: semgrep-sast
    artifacts: true
  script:
  - |
    if [ ! -f "gl-sast-report.json" ]; then
      echo "SAST report not found!"
      exit 1
    fi

    VULN_COUNT=$(jq '.vulnerabilities | length' gl-sast-report.json)
    if [ "$VULN_COUNT" -gt 0 ]; then
      echo "SAST vulnerabilities detected!"
      jq -r '.vulnerabilities[] | "- [\(.severity)] \(.name) in \(.location.file):\(.location.start_line)"' \
        gl-sast-report.json
      exit 1
    else
      echo "No SAST vulnerabilities detected"
    fi
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"

deploy:
  stage: deploy
  when: on_success
  image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  tags:
  - playground-bravo
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    DOKKU_APP: trackkr
  needs:
  - job: check_secrets
  - job: check_sast
  - job: lint
  - job: test
  - job: test-race
  - job: container-smoke
  - job: extension
  - job: portability
  before_script:
  - apk add --no-cache git openssh-client
  - eval $(ssh-agent -s)
  - echo "$DOKKU_SSH_PRIVATE_KEY_B64" | base64 -d | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - echo "$DOKKU_HOST_KEY" >> ~/.ssh/known_hosts
  script:
  - git remote add dokku "dokku@$DOKKU_HOST:$DOKKU_APP"
  - git push dokku "HEAD:refs/heads/main"
  rules:
  - if: $CI_COMMIT_BRANCH == "master"

