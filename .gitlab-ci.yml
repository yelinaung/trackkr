stages:
- security
- test
- validate
- deploy
- observability

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # Test fixtures exercise filesystem and database APIs deliberately; they
  # are covered by Go tests and should not be treated as production sinks.
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, **/*_test.go"
  ALPINE_JQ_IMAGE: apteno/alpine-jq:latest@sha256:2618c251ddb92dd09e9bee03769792df70a31083a8d4105472ef5c823b2fb8e3
  # renovate: datasource=github-releases depName=equinix-labs/otel-cli
  OTEL_CLI_VERSION: 0.4.5

include:
- template: Security/Secret-Detection.gitlab-ci.yml
- template: Security/SAST.gitlab-ci.yml

secret_detection:
  stage: security
  tags:
  - playground-bravo

check_secrets:
  stage: validate
  image: $ALPINE_JQ_IMAGE
  tags:
  - playground-bravo
  needs:
  - job: secret_detection
    artifacts: true
  script:
  - |
    if [ ! -f "gl-secret-detection-report.json" ]; then
      echo "Secret detection report not found!"
      exit 1
    fi

    if [ "$(jq '.vulnerabilities | length' gl-secret-detection-report.json)" -gt 0 ]; then
      echo "Secrets detected in the codebase!"
      jq -r '.vulnerabilities[] | "- \(.message) in \(.location.file):\(.location.start_line)"' \
        gl-secret-detection-report.json
      exit 1
    else
      echo "No secrets detected"
    fi

lint:
  stage: validate
  image: golangci/golangci-lint:v2.12-alpine@sha256:91b27804074a0bacea298707f016911e60cf0cdbc6c7bf5ccacb5f0606d18d60
  tags:
  - playground-bravo
  cache:
    key: go-lint-cache
    paths:
    - .cache/golangci-lint
  script:
  - golangci-lint run --timeout=5m ./...


test:
  stage: validate
  image: golang:1.26.5-bookworm
  tags:
  - playground-bravo
  services:
  - name: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    alias: postgres
  variables:
    POSTGRES_DB: trackkr
    POSTGRES_USER: trackkr
    POSTGRES_PASSWORD: trackkr
    # No TRACKKR_TEST_DSN: the database tests assemble one from the variables
    # above. Spelling the DSN out here duplicated the credentials and left a
    # connection string carrying a password in the tree, which secret
    # scanning reports on every pipeline.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  needs:
  - job: check_secrets
  cache:
    key: go-mod-cache
    paths:
    - .cache/go-build
    - .cache/go-mod
  before_script:
  - export GOCACHE="$(pwd)/.cache/go-build"
  - export GOMODCACHE="$(pwd)/.cache/go-mod"
  - |
    for attempt in $(seq 1 30); do
      if bash -c 'echo > /dev/tcp/postgres/5432' 2>/dev/null; then
        break
      fi
      if [ "$attempt" -eq 30 ]; then
        echo "PostgreSQL did not become reachable" >&2
        exit 1
      fi
      sleep 1
    done
  script:
  - go test -v ./...

semgrep-sast:
  stage: security
  tags:
  - playground-bravo

check_sast:
  stage: validate
  image: $ALPINE_JQ_IMAGE
  tags:
  - playground-bravo
  needs:
  - job: semgrep-sast
    artifacts: true
  script:
  - |
    if [ ! -f "gl-sast-report.json" ]; then
      echo "SAST report not found!"
      exit 1
    fi

    VULN_COUNT=$(jq '.vulnerabilities | length' gl-sast-report.json)
    if [ "$VULN_COUNT" -gt 0 ]; then
      echo "SAST vulnerabilities detected!"
      jq -r '.vulnerabilities[] | "- [\(.severity)] \(.name) in \(.location.file):\(.location.start_line)"' \
        gl-sast-report.json
      exit 1
    else
      echo "No SAST vulnerabilities detected"
    fi
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"

