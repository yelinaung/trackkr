[tools]
# go.mod requires 1.26.1; this pins the toolchain everyone actually runs.
go = "1.26.5"
# Keep in step with the version pinned in .github/workflows/ci.yml, or
# the linter passes locally and fails in CI (or the reverse).
golangci-lint = "2.12.2"
gofumpt = "0.10.0"
prek = "0.4.11"
# Node exists solely for the browser extension's tooling: web-ext is
# Mozilla's own validator and is the only thing that checks the manifest
# and API usage against strict_min_version.
node = "24.18.0"
"npm:web-ext" = "10.5.0"

[tasks.test]
description = "Run Go tests"
run = [
  "mkdir -p .cache/go-build .cache/go-mod",
  "GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go test -v ./...",
]

[tasks.test-race]
description = "Run Go tests (with race)"
run = [
  "mkdir -p .cache/go-build .cache/go-mod",
  "GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go test -v -race ./...",
]

[tasks.test-coverage]
description = "Run Go tests with coverage"
run = [
  "mkdir -p .cache/go-build .cache/go-mod",
  "GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go test -v -coverprofile=coverage.out -covermode=atomic ./...",
]

[tasks.lint]
description = "Run golangci-lint with project config"
run = [
  "mkdir -p .cache/go-build .cache/go-mod",
  "GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod golangci-lint run --config .golangci.yml ./...",
]

[tasks.format]
description = "Format Go code"
run = ["gofumpt -w ./cmd/ ./internal/"]

[tasks.ext-lint]
description = "Validate the browser extension with web-ext"
run = [
  "web-ext lint --source-dir extension --warnings-as-errors --ignore-files 'tests/**'",
]

[tasks.ext-test]
description = "Run the extension's logic tests"
# The glob is quoted deliberately: node --test treats a bare directory
# as a module path and fails to resolve it.
run = ["node --test 'extension/tests/*.test.js'"]

[tasks.ext-run]
description = "Launch Firefox with the extension loaded"
run = ["web-ext run --source-dir extension"]

[tasks.hooks]
description = "Run prek hooks"
run = ["prek run --all-files"]

[tasks.push-all]
description = "Pull with rebase from github, then push current branch to all remotes"
run = [
  "test -n \"$(git branch --show-current)\"",
  "git pull --rebase --autostash github \"$(git branch --show-current)\"",
  "git push github \"$(git branch --show-current)\"",
  "git push gitlab \"$(git branch --show-current)\"",
  "git push forgejo \"$(git branch --show-current)\"",
]

[tasks.db]
description = "Start PostgreSQL via docker-compose"
run = ["docker compose up -d db"]

[tasks.run]
description = "Run the server"
run = [
  "mkdir -p .cache/go-build .cache/go-mod",
  "GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go run ./cmd/server",
]

[tasks.tidy]
description = "Tidy Go module dependencies"
run = [
  "mkdir -p .cache/go-build .cache/go-mod",
  "GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go mod tidy",
]

[tasks.build]
description = "Build the server binary"
run = [
  "mkdir -p .cache/go-build .cache/go-mod",
  "GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go build -o trackkr-backend ./cmd/server",
]

[tasks.build-daemon]
description = "Build the trackkrd daemon binary"
run = [
  "mkdir -p .cache/go-build .cache/go-mod",
  "GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go build -o trackkrd ./cmd/trackkrd",
]

[tasks.run-daemon]
description = "Run the trackkrd daemon"
run = [
  "mkdir -p .cache/go-build .cache/go-mod",
  "GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go run ./cmd/trackkrd",
]
